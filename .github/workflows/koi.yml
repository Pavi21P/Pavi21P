name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml
      - scripts/koi-swim.js
      - assets/**

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi
      # Puts the day's koi on a figure-8 over the intro (koi/intro-light.svg, koi/intro-dark.svg).
      - name: Draw the koi swimming over the intro
        run: |
          npm install --no-save --no-package-lock --ignore-scripts omggif@1.0.10 pngjs@7.0.0
          node scripts/koi-swim.js koi/koi.gif koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/intro-light.svg koi/intro-dark.svg
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
